<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎 · 我的账户</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .welcome-card {
      max-width: 520px;
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff8fb8, #c9a6ff);
      box-shadow: 0 12px 28px rgba(255, 107, 157, 0.35);
      /* 弹跳入场 + 持续轻浮 */
      animation: avatar-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
        avatar-float 3s ease-in-out 0.6s infinite;
    }

    @keyframes avatar-in {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes avatar-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      animation: fade-slide-in 0.7s 0.15s ease-out both;
    }

    .welcome-title .username {
      background: linear-gradient(90deg, #ff6b9d, #a78bfa, #ff6b9d);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-flow 3s linear infinite;
    }

    .welcome-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
      animation: fade-slide-in 0.7s 0.25s ease-out both;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
      animation: fade-slide-in 0.7s 0.35s ease-out both;
    }

    .feature {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: left;
    }

    .feature .icon {
      font-size: 22px;
    }

    .feature .name {
      font-weight: 700;
      font-size: 14px;
      margin-top: 6px;
      color: var(--text-strong);
    }

    .feature .desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .welcome-actions {
      display: flex;
      gap: 12px;
      animation: fade-slide-in 0.7s 0.5s ease-out both;
    }

    .welcome-actions .btn-primary,
    .welcome-actions .btn-ghost {
      flex: 1;
      letter-spacing: 1px;
    }

    .loading {
      color: var(--text-muted);
      font-size: 15px;
    }

    @media (max-width: 480px) {
      .feature-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#ff6b9d" />
</head>
<body>
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="auth-card welcome-card">
    <div id="content" hidden>
      <div class="avatar" id="avatar-letter">?</div>
      <h1 class="welcome-title">你好，<span class="username" id="welcome-username">…</span></h1>
      <p class="welcome-sub">欢迎回来！你已经成功登录 👋</p>

      <div class="feature-grid">
        <div class="feature">
          <div class="icon">🔒</div>
          <div class="name">会话安全</div>
          <div class="desc">登录凭证使用 HttpOnly Cookie 保存，脚本无法读取</div>
        </div>
        <div class="feature">
          <div class="icon">🧂</div>
          <div class="name">密码加盐哈希</div>
          <div class="desc">密码通过 scrypt 加盐哈希后存储，绝不保存明文</div>
        </div>
        <div class="feature">
          <div class="icon">💾</div>
          <div class="name">本地存储</div>
          <div class="desc">用户与会话数据保存在服务器 data/ 目录的 JSON 文件中</div>
        </div>
        <div class="feature">
          <div class="icon">📱</div>
          <div class="name">响应式设计</div>
          <div class="desc">手机、平板、电脑都能获得良好的浏览体验</div>
        </div>
      </div>

      <div class="welcome-actions">
        <button class="btn-primary" id="btn-videos">🎬 观看视频</button>
        <button class="btn-ghost" id="btn-logout">退出登录</button>
      </div>
    </div>

    <div id="loading" class="loading">
      正在验证登录状态…<br />
      <span id="loading-sub" style="font-size:12px;color:#a58ba0"></span>
    </div>
  </main>

  <script src="js/animations.js"></script>
  <script>
    (async function () {
      const content = document.getElementById('content');
      const loading = document.getElementById('loading');
      const loadingSub = document.getElementById('loading-sub');

      // 带超时的登录状态检查（60 秒，覆盖云端冷启动唤醒时间）
      async function checkMe(timeoutMs) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const res = await fetch('/api/me', { credentials: 'same-origin', signal: ctrl.signal });
          clearTimeout(timer);
          return res;
        } catch (e) {
          clearTimeout(timer);
          throw e;
        }
      }

      try {
        // 提示：首次访问云端可能需要等一会（服务器唤醒）
        setTimeout(() => {
          if (!loading.hidden) loadingSub.textContent = '（首次打开云端网站可能需要等待 30~60 秒）';
        }, 5000);

        const res = await checkMe(60000);
        if (!res.ok) {
          // 未登录，跳回登录页
          window.location.href = '/index.html';
          return;
        }
        const { username } = await res.json();
        document.getElementById('welcome-username').textContent = username;
        document.getElementById('avatar-letter').textContent = username.charAt(0).toUpperCase();
        document.title = '欢迎 · ' + username;
        loading.hidden = true;
        content.hidden = false;
      } catch {
        loading.textContent = '连接服务器超时，请检查网络后重试';
        loadingSub.textContent = '';
        const retry = document.createElement('button');
        retry.textContent = '🔄 重试';
        retry.className = 'btn-primary';
        retry.style.cssText = 'margin-top:16px;letter-spacing:1px;font-size:14px;padding:10px 28px;';
        retry.onclick = () => window.location.reload();
        loading.appendChild(document.createElement('br'));
        loading.appendChild(retry);
      }

      document.getElementById('btn-logout').addEventListener('click', async () => {
        try {
          await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
        } finally {
          window.location.href = '/index.html';
        }
      });

      document.getElementById('btn-videos').addEventListener('click', () => {
        window.location.href = '/videos.html';
      });
    })();
  </script>
  <script src="js/pwa.js"></script>
</body>
</html>
